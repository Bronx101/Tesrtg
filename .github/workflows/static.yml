<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepsis Detection App</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            height: 100vh;
            overflow-y: auto; /* Ensure body can scroll vertically */
        }
        .container {
            max-width: 600px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            margin: 20px auto; /* Add margin to create space at the top */
            transition: background-color 0.5s;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #555;
            font-weight: 500;
        }
        input, select {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 5px 0 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.3s;
        }
        .check-button {
            background-color: #28a745;
            color: white;
        }
        .check-button:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        .reset-button {
            background-color: #dc3545;
            color: white;
        }
        .reset-button:hover {
            background-color: #c82333;
            transform: translateY(-2px);
        }
        .light {
            width: 24px;
            height: 24px;
            display: inline-block;
            border-radius: 50%;
            margin-left: 10px;
            vertical-align: middle;
        }
        .red-light {
            background-color: red;
        }
        .green-light {
            background-color: green;
        }
        .hidden {
            display: none;
        }
        .blink-red {
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            0% { background-color: #ffffff; }
            100% { background-color: red; }
        }
        .footer {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>
    <div id="sepsis-alert-container" class="container">
        <h1>Sepsis Detection App</h1>
        <form id="sepsisForm">
            <label>Patient Age (years):</label>
            <input type="number" id="age" placeholder="Enter patient age"><br>
            
            <label>Suspected Infection:</label>
            <select id="infection" onchange="updateLight('infection')">
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select><span id="infection-light" class="light hidden"></span><br>
            
            <label>Altered Mental Status:</label>
            <select id="mentalStatus" onchange="updateLight('mentalStatus')">
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select><span id="mentalStatus-light" class="light hidden"></span><br>
            
            <label>Systolic BP (mmHg):</label>
            <input type="number" id="bp"><span id="bp-light" class="light hidden"></span><br>
            
            <label>Heart Rate:</label>
            <input type="number" id="heartRate"><span id="hr-light" class="light hidden"></span><br>
            
            <label>Respiratory Rate:</label>
            <input type="number" id="respiratoryRate"><span id="rr-light" class="light hidden"></span><br>
            
            <label>Temperature (°F):</label>
            <input type="number" id="temperature"><span id="temp-light" class="light hidden"></span><br>
            
            <div class="button-group">
                <button type="button" class="check-button" onclick="checkSepsis()">Check Sepsis</button>
                <button type="button" class="reset-button" onclick="resetForm()">Reset</button>
            </div>
            
            <div class="footer">
                Developed by Unit 286
            </div>
        </form>
    </div>

    <script>
        function checkSepsis() {
            const age = document.getElementById('age').value;
            const infection = document.getElementById('infection').value === 'yes';
            const bp = document.getElementById('bp').value;
            const mentalStatus = document.getElementById('mentalStatus').value === 'yes';
            const heartRate = document.getElementById('heartRate').value;
            const respiratoryRate = document.getElementById('respiratoryRate').value;
            const temperature = document.getElementById('temperature').value;

            let hrLimit, rrLimit;

            if (age < 1) {
                hrLimit = 130;
                rrLimit = 40;
            } else if (age <= 12) {
                hrLimit = 110;
                rrLimit = 30;
            } else {
                hrLimit = 90;
                rrLimit = 20;
            }

            let abnormalCount = 0;

            if (heartRate) {
                if (heartRate > hrLimit || heartRate < 60) {
                    abnormalCount++;
                    showRedLight('hr');
                } else {
                    showGreenLight('hr');
                }
            } else {
                hideLight('hr');
            }

            if (respiratoryRate) {
                if (respiratoryRate > rrLimit || respiratoryRate < 12) {
                    abnormalCount++;
                    showRedLight('rr');
                } else {
                    showGreenLight('rr');
                }
            } else {
                hideLight('rr');
            }

            if (temperature) {
                if (temperature > 100.4 || temperature < 96.8) {
                    abnormalCount++;
                    showRedLight('temp');
                } else {
                    showGreenLight('temp');
                }
            } else {
                hideLight('temp');
            }

            if (bp) {
                if (bp < 90) {
                    showRedLight('bp');
                } else {
                    showGreenLight('bp');
                }
            } else {
                hideLight('bp');
            }

            let sepsis = infection && (bp < 90 || mentalStatus) && abnormalCount >= 2;

            if (sepsis) {
                document.getElementById('sepsis-alert-container').classList.add('blink-red');
            } else {
                document.getElementById('sepsis-alert-container').classList.remove('blink-red');
            }

            updateLight('infection');
            updateLight('mentalStatus');
        }

        function updateLight(id) {
            const value = document.getElementById(id).value;
            if (value === 'yes') {
                showRedLight(id);
            } else {
                showGreenLight(id);
            }
        }

        function showRedLight(id) {
            document.getElementById(id + '-light').classList.remove('hidden');
            document.getElementById(id + '-light').classList.remove('green-light');
            document.getElementById(id + '-light').classList.add('red-light');
        }

        function showGreenLight(id) {
            document.getElementById(id + '-light').classList.remove('hidden');
            document.getElementById(id + '-light').classList.remove('red-light');
            document.getElementById(id + '-light').classList.add('green-light');
        }

        function hideLight(id) {
            document.getElementById(id + '-light').classList.add('hidden');
        }

        function resetLights() {
            document.querySelectorAll('.light').forEach(light => {
                light.classList.remove('red-light', 'green-light');
                light.classList.add('hidden');
            });
            document.getElementById('sepsis-alert-container').classList.remove('blink-red');
        }

        function resetForm() {
            document.getElementById('sepsisForm').reset();
            resetLights();
        }
    </script>
</body>
</html>
